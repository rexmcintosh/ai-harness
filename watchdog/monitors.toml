# Spike-monitor config — data, not code. Non-secret (the Supabase key comes from env,
# never here). Thresholds are deliberately generous; calibrate from the metric values the
# watchdog logs on every poll (see watchdog/logs/runs.log). Missing log files / absent
# Supabase key are skipped gracefully, so this stays valid on any host.

[settings]
window_lines = 6   # supervise runs every 5 min; ~6 lines ≈ the 30-min watchdog window

# --- Layer 1: windowed log-counter budgets ---------------------------------
[[log_counters]]
name = "supervise.relaunched"
log  = "/home/dev/projects/splash_poller/logs/supervise.cron.log"
key  = "relaunched"
warn = 8
crit = 20

[[log_counters]]
name = "supervise.launched"
log  = "/home/dev/projects/splash_poller/logs/supervise.cron.log"
key  = "launched"
warn = 15
crit = 40

[[log_counters]]
name = "ingest.ingested"
log  = "/home/dev/projects/splash_poller/logs/ingest_entries.cron.log"
key  = "ingested"
warn = 500
crit = 5000

# --- Layer 1: live process-count budgets -----------------------------------
# Every writer type counts: lenex pollers, PDF/fragment live writers, and
# reconcile one-shots. POLLER_MAX=8 slots + the supervisor itself = >10 means
# something is spawning outside the slot accounting.
[[processes]]
name    = "splash.pollers"
pattern = "poller\\.py|track_pdf_meet|lastheat_ingest|reconcile_meet"
warn    = 10
crit    = 16

# --- Layer 2: Supabase row-growth budgets (rows/hour per table) ------------
# Counts are planner ESTIMATES (Prefer: count=planned), not full scans: the
# exact counts were the database's two most expensive queries (RCA 10 Oct 2026).
[supabase]
url           = "https://moaagxigxjyuuqygoqfg.supabase.co"
key_env       = "SUPABASE_SERVICE_ROLE_KEY"
warn_per_hour = 20000
crit_per_hour = 100000
tables        = ["results", "splits", "swimmers"]

# --- Layer 3: MeetTrack absence alert (the floor, not a budget) -------------
# A live-by-date meet whose writer went quiet during racing hours, a live meet
# the supervisor never launched, or a meet that hit terminal 'failed'.
# Escalation already routes to Telegram via the investigator agent.
#
# The coverage pair is the half a heartbeat cannot see: a meet still writing 37
# of its 40 published events looks perfectly healthy. Warn on 3 uncovered
# events, or on 15% of them (two minimum, so the one event being parsed right
# now is never an alert). Both are quiet while the counters are NULL — only the
# PDF writer reports them — and while their coverage_at is older than
# stale_warn_min, so last weekend's snapshot can never raise this weekend's
# alarm. Add coverage_max_age_min here to give that bound its own value.
#
# Retuned from the sr-10976 Plovdiv rehearsal (splash_poller
# docs/SEASON_READINESS.md, "Rehearsal findings", follow-up 6). Two rules:
# - "still running": the PDF writer stamps coverage_at on every tick (~65 s),
#   so its age is liveness. tick_warn_min / tick_crit_min = 10 / 30.
# - "results fresh": last_ingest_at moves only when a result changes. It now
#   alerts only while a published event has no results yet (or the counters
#   are unmeasured or stale), at 30 / 75: above the 26-min longest in-session
#   gap, and quiet over lunch, evenings and the final afternoon.
# Do not raise the plain stale numbers to cover lunch: a dead Lenex/fragment
# writer would then go unseen for hours.
[meet_freshness]
stale_warn_min     = 30
stale_crit_min     = 75
tick_warn_min      = 10
tick_crit_min      = 30
launch_overdue_min = 30
coverage_gap_warn  = 3
coverage_gap_pct   = 15
# Portugal only: the rules read racing hours in Europe/Lisbon.
nations            = ["POR"]
# Before 13:00 Lisbon a meet with no result yet today has not started racing,
# so it is not "gone quiet" (afternoon-only meets). A measured gap still alerts.
morning_grace_until = 13
# While the expect monitor (below) has run in the last 15 min, it owns the
# live-meet checks and these rules stand down; if it stops, they take over and
# meets.expect-heartbeat says so.
defer_to_expect    = true
expect_fresh_min   = 15

# --- Layer 4: MeetTrack "expected but missing" monitor ----------------------
# watchdog/expect_run.py via watchdog/run-expect.sh, every 5 minutes.
# Design, alert policy and how to add an expectation:
# docs/meettrack-expectations.md. Times are Lisbon local.
[expect]
enabled                 = true
nations                 = ["POR"]
racing_start            = "08:00"
racing_end              = "22:00"
db_timeout_s            = 8      # tiny probe; 2 failed runs in a row = CRIT
db_fail_runs            = 2
startlist_scope         = "requested"   # or "all": every listed POR meet
startlist_lead_hours    = 24
default_session_start   = "09:00"
first_results_by        = "17:00"       # morning grace when no start time is known
first_results_grace_min = 60
launch_grace_min        = 30
tick_crit_min           = 30
results_lag_min         = 20
thin_pct                = 50     # an event with results for under half its start list is "thin"
slot_lag_min            = 45
source_gap_min          = 60
repeat_crit_min         = 30
repeat_warn_min         = 60
repeat_startlist_min    = 360
max_investigations      = 3
# The AI narrative (Claude, Read tool) stays off until it runs under an
# OS-enforced file boundary: poller logs are untrusted text. When on, it is
# detached, capped at ai_timeout_s and outside the run lock.
ai_narrative            = false
ai_timeout_s            = 300

# Stated session starts, when known from the meet programme (Lisbon time).
# Without one, results are expected by first_results_by.
# [[expect.start_times]]
# sr_meet_id = "11113"
# date       = "2026-10-11"
# start      = "09:30"

# --- Jev shadow mode (SHADOW ONLY) ------------------------------------------
# A second opinion on cron-log tails from Jev (TypeSafe), written to
# watchdog/logs/jev-shadow.jsonl next to the regex rule's verdict. Nothing reads that
# file back: no status, no alert, no escalation. See watchdog/jev_shadow.py and
# docs/jev-assessment-2026-09-18.md. Compare with: python3 -m watchdog.jev_shadow report
# Kill switch: enabled = false here, or WATCHDOG_JEV_SHADOW=0 in the environment.
#
# The alerting CRON_LOGS in run.py are always shadowed. The logs below are shadowed
# ONLY: the regex rule's verdict on them is recorded for comparison and never alerts.
# Data scope (owner, 2026-09-18): public and operations data only. Do not list a log
# that carries customer, student, personal-email or financial detail (sat-prep,
# bebop, rent). tests/test_watchdog_jev_shadow.py enforces the obvious ones.
[jev_shadow]
enabled = true

[[jev_shadow.logs]]
name = "watchdog-cron"
log  = "/home/dev/projects/ai-harness/watchdog/logs/cron.log"

[[jev_shadow.logs]]
name = "council-sweep"
log  = "/home/dev/projects/ai-harness/council/logs/sweep.cron.log"

[[jev_shadow.logs]]
name = "diem-drain"
log  = "/home/dev/.local/state/diem/drain.log"

[[jev_shadow.logs]]
name = "backlog-run"
log  = "/home/dev/projects/.backlog-run/cron.log"

[[jev_shadow.logs]]
name = "ops-tick"
log  = "/home/dev/.local/state/ops/tick.log"

[[jev_shadow.logs]]
