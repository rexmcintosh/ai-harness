# Which captured messages reach a run. Read before any model runs.
# Each rule: name, action ("ignore" or "look"), and a `source` and/or `text`
# regex (Python re.search; `text` ignores case). A rule with both needs both.
# The first matching rule wins. A message no rule matches is looked at.
# Messages from sources starting with "alert-watch" (except "alert-watch-check")
# are dropped before these rules: the watcher never reacts to its own notes.

# MeetTrack expected-but-missing monitor (watchdog/expect_alerts.py render()). One
# message can hold several notices. Any [CRIT] or [WARN] line (NEW or STILL MISSING)
# is a look; a message of only [OK] RESOLVED and [--] CLOSED notices is not.
[[rule]]
name = "expect-alert"
action = "look"
source = "run-expect\\.sh|expect_run"
text = "^\\[(CRIT|WARN)\\] "

[[rule]]
name = "expect-resolved-or-closed"
action = "ignore"
source = "run-expect\\.sh|expect_run"

# Bebop (retired 2026-10-23 from cron): the briefing itself is not a failure,
# its failure line is (bebop/run-briefing.sh).
[[rule]]
name = "bebop-failed"
action = "look"
source = "run-briefing\\.sh"
text = "briefing failed"

[[rule]]
name = "bebop-briefing"
action = "ignore"
source = "run-briefing\\.sh"

# watchdog/heal.py: FIXED and RESTARTED lines report recovery; a PROBLEM line (including a
# failed restart) is looked at like any other report.
[[rule]]
name = "heal-fixed"
action = "ignore"
source = "watchdog\\.heal|heal\\.py"
text = "^(FIXED|RESTARTED): "

# The other no-AI fixers (watchdog/fix_backup.py, fix_jobs.py, cleanup.py): their
# success notes report what they already did. Their PROBLEM lines are looked at.
[[rule]]
name = "fixers-done"
action = "ignore"
source = "watchdog\\.(fix_backup|fix_jobs|fix_orphans|cleanup)|(fix_backup|fix_jobs|fix_orphans|cleanup)\\.py"
text = "^(FIXED|STARTED|RERAN|CLEANED|STOPPED): "

# The Monday all-well line (watchdog/weekly.py). Its problems are already raised by
# the watchdog's own checks, so the summary itself is never a report.
[[rule]]
name = "weekly-check"
action = "ignore"
source = "watchdog\\.weekly|weekly\\.py"
text = "^Weekly check, "

# Finished backlog work waits for Rex's review; it is not a failure.
[[rule]]
name = "backlog-run"
action = "ignore"
source = "backlog-?run"

# Stranded work needs Rex's choice of recovery.
[[rule]]
name = "session-gc"
action = "ignore"
source = "session-gc|sessiongc"

# A page-change watch, not a failure.
[[rule]]
name = "hq-watch"
action = "ignore"
source = "usna-summer-seminar"

# New user feedback already becomes a backlog item.
[[rule]]
name = "attainprep-feedback"
action = "ignore"
source = "feedback-sync|feedback:market"
