<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio | Log in</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-page"><main class="login-panel"><span class="portfolio-mark" aria-hidden="true">P</span><h1>Your portfolio.<br>Your next decision.</h1><p>Sign in to see the work, the evidence, and what needs you.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required autofocus>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<button type="submit">Log in</button></form></main></body></html>
