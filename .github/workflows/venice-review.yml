name: Venice Review Council

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to a commit SHA so the merge gate is reproducible.
      # This pin is NOT optional for the usage steps below: council-v0.4.0
      # (4a01298) packaged `council` alone, so it ships no venice_usage — the
      # gate logs no spend at all there, and `venice-usage` is not a command.
      # The pinned repair includes usage logging, compatible Settings, and
      # consequence-based gates for privileged tooling. It becomes remotely
      # available with the approved merge and push of this branch.
      # Bump intentionally on each council release.
      - name: Install council
        run: pip install --quiet "council @ git+https://github.com/rexmcintosh/ai-harness@1f9871d07786b897b186fe3ad24203efb2ed1c07"

      - name: Compute diff
        id: diff
        run: |
          git diff --no-color "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          echo "size=$(wc -c </tmp/pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Run Venice review council
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DIFF_PATH: /tmp/pr.diff
          # Put the usage ledger somewhere we can find it again. Without this it
          # lands in the runner's $HOME and dies with the job.
          VENICE_USAGE_DB: ${{ runner.temp }}/venice-usage.db
        run: python scripts/venice_review.py

      # Accounting must never be the reason a merge gate fails: always(), and
      # continue-on-error on both steps. A lost usage row is a lost row; a
      # blocked merge is a blocked merge.
      - name: Export Venice usage
        if: always()
        continue-on-error: true
        env:
          VENICE_USAGE_DB: ${{ runner.temp }}/venice-usage.db
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: venice-usage export --output "${{ runner.temp }}/venice-usage.jsonl"

      - name: Upload Venice usage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # run_attempt keeps a re-run from colliding with the immutable v4
          # artifact of attempt 1 — and a re-run really is a second panel.
          name: venice-usage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/venice-usage.jsonl
          retention-days: 90
          if-no-files-found: warn
